<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify Admin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="app-container">
        <!-- Ambient Background -->
        <div class="ambient-bg"></div>
        
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-music"></i> Streamify Admin
            </div>
            <nav>
                <a href="index.html"><i class="fa-solid fa-home"></i> Back to Player</a>
            </nav>
        </header>

        <main class="main-content admin-main">
            <div class="admin-panel">
                <h2 id="formTitle">Add New Song</h2>
                <form id="songForm">
                    <input type="hidden" id="songId">
                    <div class="form-group">
                        <label for="title">Song Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="artist">Artist</label>
                        <input type="text" id="artist" required>
                    </div>
                    <div class="form-group">
                        <label for="album">Album</label>
                        <input type="text" id="album">
                    </div>
                    <div class="form-group">
                        <label for="cover_url">Cover Image URL</label>
                        <input type="url" id="cover_url" required placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="audio_url">Cloudinary Audio URL</label>
                        <input type="url" id="audio_url" required placeholder="https://res.cloudinary.com/...">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submitBtn">Add Song</button>
                        <button type="button" class="btn-secondary hidden" id="cancelBtn">Cancel Edit</button>
                    </div>
                </form>
            </div>

            <div class="admin-list">
                <h2>Manage Songs</h2>
                <div class="table-container">
                    <table id="songsTable">
                        <thead>
                            <tr>
                                <th>Cover</th>
                                <th>Title</th>
                                <th>Artist</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="songsTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="admin.js"></script>
</body>
</html>
