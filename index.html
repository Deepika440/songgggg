<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify - Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Ambient Background -->
        <div class="ambient-bg"></div>

        <!-- Sidebar / Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-music"></i> Streamify
            </div>
            <nav>
                <a href="index.html" class="active"><i class="fa-solid fa-home"></i> Home</a>
                <a href="admin.html"><i class="fa-solid fa-lock"></i> Admin</a>
            </nav>
            <div class="search-container">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search songs...">
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="page-title">Discover Music</h1>
            <div id="songsGrid" class="songs-grid">
                <!-- Songs will be injected here -->
            </div>
        </main>

        <!-- Player Bar -->
        <div class="player-bar">
            <div class="now-playing" id="nowPlayingSection">
                <img id="playerCover" src="https://via.placeholder.com/60" alt="Cover" class="cover">
                <div class="info">
                    <div id="playerTitle" class="title">No song selected</div>
                    <div id="playerArtist" class="artist">-</div>
                </div>
                <!-- Visualizer -->
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="player-controls-container">
                <div class="controls">
                    <button id="prevBtn" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="playBtn" class="control-btn play-btn"><i class="fa-solid fa-play"></i></button>
                    <button id="nextBtn" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar-wrapper" id="progressWrapper">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="volume-container">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>

            <audio id="audioPlayer"></audio>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
